project:
  name: Reflex
server:
  connection: ssm
  instance_id: i-0123456789abcdef0
  region: eu-west-2
  user: ubuntu
  # host key must be pre-trusted; do not disable verification
  known_hosts_file: ~/.ssh/known_hosts
deployment:
  workers: 3
  keep_releases: 2
hosts:
  logixs:
    deploy_path: /mnt/nfs/sites/logixs
  joshua-robert:
    deploy_path: /mnt/nfs/sites/joshua-robert
aws:
  aws_account_id: 'YOUR_AWS_ACCOUNT_ID'
  aws_region: eu-west-2
php:
  version: '8.3'
composer:
  install: true
silverstripe:
  dev_build: true
assets:
  enabled: true
  image: node:14
  command: yarn webpack --config webpack.config.js
  output: public/build
shared_dirs:
  - public/assets
shared_files:
  - .env
exclude:
  - deploy.yml
  - .deployignore
